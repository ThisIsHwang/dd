name: bootstrap-source

on:
  push:
    branches: [main]
    paths:
      - "_bootstrap/**"
      - ".github/workflows/bootstrap.yml"

permissions:
  contents: write

jobs:
  expand-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify source archive structure
        shell: bash
        run: |
          sha256sum _bootstrap/progressflip_visual_self_state_v0.5.0.tar.gz
          file _bootstrap/progressflip_visual_self_state_v0.5.0.tar.gz
          tar -tzf _bootstrap/progressflip_visual_self_state_v0.5.0.tar.gz >/dev/null

      - name: Expand repository source
        shell: bash
        run: |
          tar -xzf _bootstrap/progressflip_visual_self_state_v0.5.0.tar.gz -C .
          rm -rf _bootstrap
          rm -f .github/workflows/bootstrap.yml

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install CPU test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Validate expanded source
        shell: bash
        run: |
          python -m pytest -q
          python -m compileall -q progressflip tests
          for file in scripts/*.sh scripts/*.sbatch; do
            bash -n "$file"
          done

      - name: Commit expanded source
        shell: bash
        run: |
          git config user.name "ProgressFlip Bootstrap"
          git config user.email "progressflip-bootstrap@users.noreply.github.com"
          git add -A
          git commit -m "Publish standalone visual self-state experiment repository"
          git push origin HEAD:main
