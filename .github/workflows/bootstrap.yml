name: bootstrap-source

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  expand-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reassemble and verify source archive
        shell: bash
        run: |
          cat _bootstrap/chunks/part-* | base64 --decode > /tmp/progressflip-source.tar.gz
          echo "1b0b6cb0731f7f18760ecefef6d2342c90a5047afe17609a7d3eb7ddf1ceff8d  /tmp/progressflip-source.tar.gz" | sha256sum -c -
          tar -tzf /tmp/progressflip-source.tar.gz >/dev/null

      - name: Expand repository source
        shell: bash
        run: |
          tar -xzf /tmp/progressflip-source.tar.gz -C .
          rm -rf _bootstrap
          rm -f .github/workflows/bootstrap.yml

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install CPU test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Validate expanded source
        shell: bash
        run: |
          python -m pytest -q
          python -m compileall -q progressflip tests
          for file in scripts/*.sh scripts/*.sbatch; do
            bash -n "$file"
          done

      - name: Commit expanded source
        shell: bash
        run: |
          git config user.name "ProgressFlip Bootstrap"
          git config user.email "progressflip-bootstrap@users.noreply.github.com"
          git add -A
          git commit -m "Publish standalone visual self-state experiment repository"
          git push origin HEAD:main
