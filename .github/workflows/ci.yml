name: cpu-tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install -e '.[dev]'
      - run: pytest
      - run: python -m compileall -q src tests
      - run: ruff check src tests
      - name: Check shell and Slurm syntax
        run: |
          bash -n scripts/*.sh
          for file in slurm/*.sbatch; do bash -n "$file"; done
