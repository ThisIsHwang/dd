[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "progressflip-vla"
version = "0.1.0"
description = "Causal experiments for visual self-state dominance in VLA policies"
readme = "README.md"
requires-python = ">=3.10,<3.12"
license = {text = "MIT"}
authors = [{name = "Taeho Hwang"}]
dependencies = [
  "numpy>=1.26,<2",
  "PyYAML>=6.0",
  "scipy>=1.11",
  "pandas>=2.1",
  "matplotlib>=3.8",
  "imageio[ffmpeg]>=2.34",
  "Pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
progressflip = "progressflip.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py310"
